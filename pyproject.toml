[project]
name = "roi-calculator"
version = "1.0.0"
description = "Offline desktop ROI calculator for any investment."
readme = "README.md"
license = "LicenseRef-AmadOpenSource-1.0"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.7,<7.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N"]
